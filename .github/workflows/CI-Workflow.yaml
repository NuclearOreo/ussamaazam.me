name: Website CI/CD

on:
  push:
    branches: [version-2]

jobs:
  deploy-site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_KEY  }}

      - name: Use Node.js 22.14.0
        uses: actions/setup-node@v3
        with:
          node-version: 22.14.0
          cache: 'npm'

      - name: Install Packages
        run: npm ci

      - name: Run Unit Tests
        run: npm run coverage

      - name: Build Project
        run: npm run build

      - name: Build Docker Image
        run: docker build -t site:latest .

      - name: Configure Docker Client
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Push Docker Image to Artifact Registry
        run: |-
          docker tag site:latest us-east1-docker.pkg.dev/website-353503/personal-site/site:latest
          docker push us-east1-docker.pkg.dev/website-353503/personal-site/site:latest

      - name: Deploy
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          image: 'us-east1-docker.pkg.dev/website-353503/personal-site/site:latest'
          region: 'us-east1'
          service: 'personal-site'
